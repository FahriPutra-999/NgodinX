<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduGame Track</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .login-card { border-radius: 1rem; border: none; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100 py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <!-- Brand Header -->
                <div class="text-center mb-4">
                    <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
                        <span class="bg-primary text-white px-2.5 py-1.5 rounded-3 fw-bold fs-4 shadow-sm">EG</span>
                        <span class="fw-bold fs-4 text-dark">EduGame Track</span>
                    </a>
                    <p class="text-muted small mt-2">Portal Pembelajaran & Gamifikasi Pendidikan</p>
                </div>

                <!-- Login Card -->
                <div class="card login-card p-4 p-md-5 bg-white">
                    
                    <!-- Pilihan Role -->
                    <ul class="nav nav-pills nav-fill mb-4 bg-light p-1 rounded-3" id="roleTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active fw-semibold small py-2 rounded-2" type="button" onclick="setRole('siswa')">👨‍🎓 Siswa</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link fw-semibold small py-2 rounded-2" type="button" onclick="setRole('guru')">👩‍🏫 Guru / Admin</button>
                        </li>
                    </ul>

                    <!-- Form Login -->
                    <form onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-bold text-secondary" id="label-email">Email / NISN Siswa</label>
                            <input type="text" class="form-control form-control-lg fs-6" id="email" placeholder="Masukkan akun Anda" required>
                        </div>
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center">
                                <label for="password" class="form-label small fw-bold text-secondary">Kata Sandi</label>
                                <a href="#" onclick="alert('Fitur pemulihan sandi dikirim ke email.')" class="small text-decoration-none text-primary">Lupa sandi?</a>
                            </div>
                            <input type="password" class="form-control form-control-lg fs-6" id="password" placeholder="••••••••" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold fs-6 shadow-sm py-3" id="btn-submit">Masuk sebagai Siswa</button>
                        </div>
                    </form>
                </div>

                <div class="text-center mt-4">
                    <a href="index.html" class="text-muted small text-decoration-none">← Kembali ke Beranda Utama</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentRole = 'siswa';

        function setRole(role) {
            currentRole = role;
            const labelEmail = document.getElementById('label-email');
            const btnSubmit = document.getElementById('btn-submit');

            if (role === 'siswa') {
                labelEmail.textContent = 'Email / NISN Siswa';
                btnSubmit.textContent = 'Masuk sebagai Siswa';
            } else {
                labelEmail.textContent = 'Email / NIP Guru';
                btnSubmit.textContent = 'Masuk sebagai Guru / Admin';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            
            if (currentRole === 'siswa') {
                alert("Login Berhasil! Mengarahkan ke Dashboard Siswa...");
                window.location.href = "dashboard-siswa.html";
            } else {
                alert("Login Berhasil! Mengarahkan ke Dashboard Guru...");
                window.location.href = "dashboard-guru.html";
            }
        }
    </script>
</body>
</html>
